name: Build & Release Sora APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Genuine Android Release APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Run Type Checking & Automated Tests
        run: |
          npm run type-check
          npm test

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Web Assets to Android Assets Folder
        run: |
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/dist/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager --licenses || true

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: Copy & Name Output APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Sora.apk
          ls -lh Sora.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sora-Release-APK
          path: Sora.apk

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 Sora.apk --clobber || gh release create v1.0.0 Sora.apk --title "Sora v1.0.0 - Apple Music Android Edition" --notes "Sora - Apple Music Android Edition"
